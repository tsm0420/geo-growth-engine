name: GEO weekly report
on:
  schedule:
    - cron: '0 8 * * 1'
  workflow_dispatch:
    inputs:
      config:
        description: Checked-in config path; the default is a fictional demonstration
        default: examples/.geo/config.yaml
        required: true
      visibility_input:
        description: Optional checked-in JSONL evidence; no samples are collected automatically
        required: false
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GEO_CONFIG: ${{ inputs.config || 'examples/.geo/config.yaml' }}
      GEO_VISIBILITY_INPUT: ${{ inputs.visibility_input || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Audit configured local artifacts
        run: node dist/src/cli.js audit --config "$GEO_CONFIG" --output "$RUNNER_TEMP/geo-weekly-reports"
      - name: Check supplied app metadata
        if: ${{ !cancelled() }}
        run: node dist/src/cli.js aso --config "$GEO_CONFIG" --output "$RUNNER_TEMP/geo-weekly-reports"
      - name: Plan supported content
        if: ${{ !cancelled() }}
        run: node dist/src/cli.js plan --config "$GEO_CONFIG" --output "$RUNNER_TEMP/geo-weekly-reports"
      - name: Import supplied visibility evidence
        if: ${{ !cancelled() && env.GEO_VISIBILITY_INPUT != '' }}
        run: node dist/src/cli.js visibility --config "$GEO_CONFIG" --input "$GEO_VISIBILITY_INPUT" --output "$RUNNER_TEMP/geo-weekly-reports"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: geo-weekly-reports
          path: ${{ runner.temp }}/geo-weekly-reports/
          if-no-files-found: error
          retention-days: 30
