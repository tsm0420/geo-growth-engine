name: GEO core verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Generate fictional example reports
        run: |
          node dist/src/cli.js audit --config examples/.geo/config.yaml --output "$RUNNER_TEMP/geo-example-reports"
          node dist/src/cli.js aso --config examples/.geo/config.yaml --output "$RUNNER_TEMP/geo-example-reports"
          node dist/src/cli.js plan --config examples/.geo/config.yaml --output "$RUNNER_TEMP/geo-example-reports"
          node dist/src/cli.js visibility --config examples/.geo/config.yaml --input examples/visibility.jsonl --output "$RUNNER_TEMP/geo-example-reports"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: fictional-geo-example-reports
          path: ${{ runner.temp }}/geo-example-reports/
          if-no-files-found: error
          retention-days: 14
